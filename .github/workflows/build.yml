name: Validate and publish panel image

on:
  push:
    branches: [release/nats-sync]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: panel-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DEBUG: "false"
  TZ: UTC
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  database-tests:
    uses: ./.github/workflows/test-database-migrations.yml

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --group dev
      - run: uv run ruff check --output-format=github .

  nats-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --group dev
      - name: Install NATS server
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          version=2.10.29
          archive="nats-server-v${version}-linux-amd64.tar.gz"
          release="https://github.com/nats-io/nats-server/releases/download/v${version}"
          curl --fail --location --retry 3 "$release/$archive" --output "$archive"
          curl --fail --location --retry 3 "$release/SHA256SUMS" --output SHA256SUMS
          grep " ${archive}$" SHA256SUMS | sha256sum --check
          tar -xzf "$archive"
          echo "NATS_SERVER_BINARY=$RUNNER_TEMP/nats-server-v${version}-linux-amd64/nats-server" >> "$GITHUB_ENV"
      - name: Test synchronization and recovery
        run: >-
          uv run pytest tests/test_nats_kv_index.py tests/test_nats_node_memory.py
          tests/test_nats_sync_integration.py -q --junitxml=nats-results.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nats-test-results
          path: nats-results.xml

  dashboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
        working-directory: dashboard
      - run: ./build_dashboard.sh
      - uses: actions/upload-artifact@v7
        with:
          name: dashboard-build
          path: dashboard/build/
          retention-days: 7

  publish:
    needs: [database-tests, lint, nats-tests, dashboard]
    if: github.repository == 'DrSaeedHub/panel'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/drsaeedhub/panel
      RELEASE_TAG: nats-sync-3c19d701
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Check that this release is unpublished
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; choose a new release tag." >&2
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: dashboard-build
          path: dashboard/build/
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
          cache-from: type=gha,scope=panel-amd64
          cache-to: type=gha,mode=max,scope=panel-amd64
      - name: Check runtime imports and dashboard assets
        run: |
          docker run --rm --network none --entrypoint /code/.venv/bin/python \
            -e DEBUG=false -e NATS_ENABLED=false -e UVICORN_WORKERS=1 \
            "$IMAGE:$RELEASE_TAG" -B -c \
            "from pathlib import Path; from app.nats.kv_index import KvKeyIndex; from app.nats.kv_cleanup import compact_deleted_keys; from app.node.nats_memory import NatsUserSyncStore; assert Path('/code/dashboard/build/index.html').is_file(); print('Runtime imports and dashboard assets verified')"
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image and record immutable reference
        run: |
          docker push "$IMAGE:$RELEASE_TAG"
          docker image inspect "$IMAGE:$RELEASE_TAG" --format '{{index .RepoDigests 0}}' > image-reference.txt
      - name: Export image archive
        run: |
          docker save "$IMAGE:$RELEASE_TAG" | gzip > panel-linux-amd64.tar.gz
          sha256sum panel-linux-amd64.tar.gz image-reference.txt > SHA256SUMS
      - name: Publish prerelease
        run: |
          cat > release-notes.md <<EOF
          Reduce idle NATS queue polling, bound concurrent queue writes, and compact completed synchronization records.

          Container image: \`$IMAGE:$RELEASE_TAG\`

          Immutable image reference: \`$(cat image-reference.txt)\`

          Platform: \`linux/amd64\`. Runtime changes are from commit \`3c19d701a0f88ce5ba3ac67635969e1f8478be56\`.

          Validation completed before publication:
          - SQLite, PostgreSQL, TimescaleDB, MySQL, and MariaDB migration and application test suites.
          - Real NATS synchronization and recovery tests.
          - Ruff checks and dashboard build.
          - Container runtime imports and compiled dashboard assets.

          CI: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          The image archive can also be imported with \`docker load --input panel-linux-amd64.tar.gz\` after verifying \`SHA256SUMS\`.
          EOF
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "NATS sync performance" --notes-file release-notes.md \
            panel-linux-amd64.tar.gz image-reference.txt SHA256SUMS
